name: ACTION-5 CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 'Run full native/WebGL2 E2E'
        type: boolean
        default: false

permissions:
  contents: read

# Do not burn runner time on superseded PR updates.
concurrency:
  group: action5-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: CI / Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      run_full_e2e: ${{ steps.tier.outputs.full }}
    steps:
      - uses: actions/checkout@v7

      - name: Select CI tier
        id: tier
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_FULL: ${{ inputs.full_e2e || false }}
        run: |
          set -euo pipefail
          full=false
          if [[ "$EVENT_NAME" == 'push' && "$REF_NAME" == 'refs/heads/master' ]]; then
            full=true
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "$DISPATCH_FULL" == 'true' ]]; then
            full=true
          else
            # PR checkout is a synthetic merge commit. Inspect its actual
            # latest head commit instead; never evaluate a PR title/body.
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then
              git fetch --no-tags --quiet --depth=1 origin "$PR_HEAD_SHA"
              message="$(git show -s --format=%B FETCH_HEAD)"
            else
              message="$(git show -s --format=%B HEAD)"
            fi
            if grep -Fqi '[full-e2e]' <<< "$message"; then
              full=true
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "ACTION5_CI_MODE full_e2e=$full event=$EVENT_NAME"

      - name: Install pinned Godot editor
        env:
          INSTALL_EXPORT_TEMPLATES: 'false'
        run: bash ci/install-godot.sh

      - name: Cold-start addon scripts without class cache or imported assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          test ! -f .godot/global_script_class_cache.cfg
          # GLB is an imported PackedScene; full game startup is exercised
          # immediately after make import. Pre-import only parser smoke is valid.
          godot --headless --path . --script res://tests/cold_start.gd 2>&1 | tee build/evidence/cold-start.log
          python3 tools/check_godot_log.py build/evidence/cold-start.log
          grep -q ACTION5_COLD_START_SCRIPTS_OK build/evidence/cold-start.log

      - name: Run make check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          timeout 100s make check 2>&1 | tee build/evidence/checks.log
          cp build/logs/import.log build/evidence/import.log
          cp build/logs/test.log build/evidence/tests.log
          python3 tools/check_godot_log.py build/evidence/checks.log build/evidence/import.log build/evidence/tests.log
          grep -q 'ACTION5_TEST_RESULT' build/evidence/tests.log
          grep -q 'failures=0' build/evidence/tests.log

      - name: Upload checks evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-checks-evidence
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14


  full-e2e:
    name: CI / Full E2E
    needs: checks
    # This check is skipped successfully on ordinary PR updates. If a PR
    # opts in via [full-e2e], GitHub branch protection requires it to pass.
    if: needs.checks.outputs.run_full_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Godot and export templates
        env:
          INSTALL_EXPORT_TEMPLATES: 'true'
        run: bash ci/install-godot.sh

      - name: Build Linux/Web and smoke native scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          # One Make invocation shares the import across game and two exports.
          timeout 240s make run build RUN_ARGS="--headless --quit-after 20" 2>&1 | tee build/evidence/build.log
          cp build/logs/import.log build/evidence/import.log
          cp build/logs/export-linux.log build/evidence/export-linux.log
          cp build/logs/export-web.log build/evidence/export-web.log
          python3 tools/check_godot_log.py build/evidence/build.log build/evidence/import.log build/evidence/export-linux.log build/evidence/export-web.log
          python3 tools/check_exports.py

      - name: Verify test runner fails for an intentional broken assertion
        shell: bash
        run: |
          set -euo pipefail
          if godot --headless --path . --script res://tests/run_all.gd -- --self-test-failure > build/evidence/negative-test.log 2>&1; then
            echo 'ERROR: intentionally broken assertion was accepted!' >&2
            exit 1
          fi
          grep -q 'failures=1' build/evidence/negative-test.log
          grep -q 'Intentional assertion verifies runner exits nonzero' build/evidence/negative-test.log
          echo ACTION5_NEGATIVE_SELF_TEST_OK

      - name: Run exported Linux executable
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s build/linux/action5-demo.x86_64 --headless --quit-after 90 2>&1 | tee build/evidence/native-export-run.log
          python3 tools/check_godot_log.py build/evidence/native-export-run.log

      - name: Capture native rendered evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 >/dev/null
          xvfb-run -a -s '-screen 0 1280x720x24' godot --audio-driver Dummy --path . --script res://tests/capture_scene.gd 2>&1 | tee build/evidence/native-screenshot.log
          python3 tools/check_godot_log.py build/evidence/native-screenshot.log
          test -s build/evidence/native-scene.png
          for i in {1..5}; do
            test -s "build/evidence/native-view-$i.png"
          done
          test -s build/evidence/native-isometric-shoulder.png
          test -s build/evidence/native-isometric-settings.png
          test -s build/evidence/native-f3-near-wall.png
          test -s build/evidence/native-f4-near-wall.png
          test -s build/evidence/native-player-shadow-on.png
          test -s build/evidence/native-player-shadow-off.png
          test -s build/evidence/native-f4-combat-idle.png
          test -s build/evidence/native-f4-punch-limb.png
          test -s build/evidence/native-f4-kick-limb.png
          grep -q 'ACTION5_F4_NATIVE_LIMB_OK action=punch' build/evidence/native-screenshot.log
          grep -q 'ACTION5_F4_NATIVE_LIMB_OK action=kick' build/evidence/native-screenshot.log
          test -s build/evidence/native-d05-punch.png
          test -s build/evidence/native-d05-kick.png
          grep -q 'ACTION5_D05_NATIVE_COMBAT_OK punch=1 kick=1 active=1 dedup=1' build/evidence/native-screenshot.log
          test -s build/evidence/native-d06-bat-world.png
          test -s build/evidence/native-d06-bat-f4.png
          test -s build/evidence/native-d06-bat-f4-swing.png
          test -s build/evidence/native-d06-bat-f4-horizontal.png
          test -s build/evidence/native-d06-bat-f4-near-wall.png
          test -s build/evidence/native-d06-shovel-f4-overhead.png
          for view in 1 2 3 5; do
            test -s "build/evidence/native-d06-bat-bat_vertical-view-$view.png"
            test -s "build/evidence/native-d06-bat-bat_horizontal-view-$view.png"
            test -s "build/evidence/native-d06-shovel-overhead-view-$view.png"
          done
          grep -q 'ACTION5_D06_F4_SWING_NATIVE_OK grip=1 unarmed_hidden=1' build/evidence/native-screenshot.log
          grep -q 'ACTION5_D06_F4_HORIZONTAL_NATIVE_OK grip=1 distinct=1' build/evidence/native-screenshot.log
          grep -q 'ACTION5_D06_WORLD_POSE_NATIVE_OK view=5 attack=shovel_overhead' build/evidence/native-screenshot.log
          test -s build/evidence/native-d06-dropped-f4.png
          grep -q 'ACTION5_D06_NATIVE_EQUIPMENT_OK world=1 f4=1 drop=1' build/evidence/native-screenshot.log
          for view in 1 2 3 5; do
            test -s "build/evidence/native-d06-gun-view-$view.png"
          done
          for shot in idle fire reload near-wall; do
            test -s "build/evidence/native-d06-gun-f4-$shot.png"
          done
          test -s build/evidence/native-d06-gun-f3-projectile.png
          grep -q 'ACTION5_D06_GUN_NATIVE_OK world=4 f4=1 muzzle=1 reload=1 projectile=1' build/evidence/native-screenshot.log
          grep -q 'ACTION5_PLAYER_SHADOW_NATIVE_OK' build/evidence/native-screenshot.log
          grep -q 'ACTION5_FPS_NEAR_WALL_NATIVE_OK wall=1 body_culled=1' build/evidence/native-screenshot.log
          grep -q 'ACTION5_FIVE_VIEW_SCREENSHOTS_OK 5' build/evidence/native-screenshot.log

      - name: Verify real WebGL2 browser startup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web > build/evidence/web-server.log 2>&1 &
          echo "$!" > build/evidence/web-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/index.html -o /dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          # browser-smoke.mjs launches headless Chromium with no channel;
          # skip the separate headed Chromium download on every E2E run.
          npx playwright install --with-deps --only-shell chromium
          # Bound failures that would otherwise leave the software WebGL2
          # browser running until the 18-minute job timeout.
          timeout 600s node ci/browser-smoke.mjs 2>&1 | tee build/evidence/browser-smoke.log
          test -s build/evidence/web-scene.png
          for i in {1..5}; do
            test -s "build/evidence/web-view-$i.png"
          done
          test -s build/evidence/web-selector-view-1.png
          test -s build/evidence/web-camera-settings.png
          test -s build/evidence/web-d03-walking.png
          test -s build/evidence/web-d03-jumping.png
          test -s build/evidence/web-f4-arm-standing.png
          test -s build/evidence/web-f4-arm-jumping.png
          grep -q 'ACTION5_BROWSER_F4_JUMP_ARM_OK viewmodel=1 screenshots=2' build/evidence/browser-smoke.log
          test -s build/evidence/web-f4-combat-punch.png
          test -s build/evidence/web-f4-combat-kick.png
          grep -q 'ACTION5_BROWSER_F4_COMBAT_LIMBS_OK punch_arm=1 kick_leg=1 screenshots=2' build/evidence/browser-smoke.log
          test -s build/evidence/web-d05-punch.png
          test -s build/evidence/web-d05-kick.png
          grep -q 'ACTION5_BROWSER_D05_COMBAT_OK punch=1 kick=1 screenshots=2' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_D05_MOUSE_OK punch=1 kick=1 hud_blocked=1' build/evidence/browser-smoke.log
          test -s build/evidence/web-d06-world-equipped.png
          test -s build/evidence/web-d06-f4-equipped.png
          test -s build/evidence/web-d06-f4-swing.png
          test -s build/evidence/web-d06-f4-dropped.png
          for name in web-d06-f4-bat-horizontal.png web-d06-f4-shovel-overhead.png \
                      web-d06-f4-shovel-kick.png web-d06-f4-bat-narrow.png \
                      web-d06-f4-shovel-narrow.png; do
            test -s "build/evidence/$name"
          done
          grep -q 'ACTION5_BROWSER_D06_DUAL_INPUT_OK bat=2 shovel=1 shovel_kick=1 views=2,4 keyboards=1' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_D06_EQUIPMENT_OK pickup=2 swap=1 mouse=2 f4_swing=1 drop=2 f4=1' build/evidence/browser-smoke.log
          test -s build/evidence/web-f3-near-wall.png
          test -s build/evidence/web-f4-near-wall.png
          grep -q 'ACTION5_BROWSER_FPS_NEAR_WALL_OK' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_D04_RIG_OK skeleton=1 sockets=1 fps=1' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_MOVE_PLUGIN_OK slide=1' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_D03_LOCOMOTION_OK walk=1 jump=1' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_FOCUS_OK view=1 settings=1 jump=1' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_CAMERA_SETTINGS_OK open=1 shortcut=1' build/evidence/browser-smoke.log
          grep -q 'ACTION5_BROWSER_FIVE_VIEWS_OK unique=5 selector=1' build/evidence/browser-smoke.log

      - name: Upload full E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-full-e2e-evidence
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full E2E exports
        uses: actions/upload-artifact@v7
        with:
          name: ci-full-e2e-exports
          path: |
            build/linux/
            build/web/
          if-no-files-found: error
          retention-days: 14

      # Reuse the exact Web export validated by the browser smoke above;
      # do not spend another runner/build on an independent Pages export.
      - name: Package validated Web export for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-pages:
    name: CI / Deploy Pages
    # Only publish validated artifacts from master; never from PRs or
    # workflow_dispatch runs (including their full-e2e opt-in).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: full-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Web game to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
